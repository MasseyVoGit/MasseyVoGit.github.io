<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Massey Vo // Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    /* Cosmic / deep space palette */
    --bg-1: #0a0518;
    --bg-2: #1a0a35;
    --bg-3: #2d1654;
    --bg-4: #3b1f6e;

    --dialog-bg: #f0eaf8;
    --dialog-border-outer: #a87bd9;
    --dialog-border-inner: #5a2d8f;
    --dialog-shadow: #1a0a35;

    --text: #2a1850;
    --text-dim: #6a4d8a;
    --text-light: #e8d8f5;
    --text-light-dim: #ad94c8;

    --accent-magenta: #e84a9e;
    --accent-magenta-dark: #a82670;
    --accent-violet: #b896d9;
    --accent-violet-dark: #6e4ba8;
    --accent-gold: #f5d96a;
    --accent-cyan: #6bd9e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 30%, var(--bg-3) 70%, var(--bg-4) 100%);
    color: var(--text-light);
    line-height: 1.7;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Nebula glow */
  .nebula {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100vh;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(232, 74, 158, 0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 10%, rgba(107, 217, 232, 0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(184, 150, 217, 0.2) 0%, transparent 55%);
    z-index: 0;
    pointer-events: none;
    animation: nebulaShift 30s ease-in-out infinite;
  }
  @keyframes nebulaShift {
    0%, 100% { opacity: 0.85; transform: translateX(0); }
    50% { opacity: 1; transform: translateX(30px); }
  }

  /* Stars */
  .starfield {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  .star.gold { background: var(--accent-gold); box-shadow: 0 0 4px var(--accent-gold); }
  .star.magenta { background: var(--accent-magenta); box-shadow: 0 0 4px var(--accent-magenta); }
  .star.cyan { background: var(--accent-cyan); box-shadow: 0 0 4px var(--accent-cyan); }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  /* Texture */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.3 0 0 0 0 0.7 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.6;
    mix-blend-mode: overlay;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--dialog-bg);
    padding: 14px 32px;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow:
      inset 0 0 0 2px var(--dialog-border-outer),
      inset 0 0 0 4px var(--dialog-bg),
      inset 0 0 0 5px var(--dialog-border-inner),
      0 4px 16px rgba(13, 5, 24, 0.5);
  }
  .nav-brand {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--dialog-border-inner);
    text-decoration: none;
    letter-spacing: 1px;
  }
  .back-link {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--accent-magenta-dark); }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 110px 32px 120px;
    position: relative;
    z-index: 10;
  }

  .breadcrumb {
    color: var(--accent-violet);
    font-size: 13px;
    margin-bottom: 24px;
    text-shadow: 0 0 8px rgba(184, 150, 217, 0.4);
  }
  .breadcrumb a { color: var(--accent-magenta); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent-gold); }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 30px;
    line-height: 1.4;
    margin-bottom: 16px;
    color: var(--text-light);
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5), 0 0 24px rgba(232, 74, 158, 0.5);
  }
  h1 .accent {
    color: var(--accent-gold);
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5), 0 0 24px rgba(245, 217, 106, 0.6);
  }

  .subtitle {
    color: var(--accent-gold);
    font-size: 14px;
    margin-bottom: 48px;
    font-style: italic;
  }

  .header-actions {
    display: flex;
    gap: 16px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    padding: 12px 26px;
    background: var(--dialog-bg);
    color: var(--dialog-border-inner);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 10px;
    border: none;
    box-shadow:
      inset 0 0 0 2px var(--dialog-border-outer),
      inset 0 0 0 4px var(--dialog-bg),
      inset 0 0 0 5px var(--dialog-border-inner),
      0 3px 0 var(--dialog-shadow),
      0 4px 12px rgba(13, 5, 24, 0.4);
  }
  .btn:hover {
    transform: translateY(-2px);
    color: var(--accent-magenta-dark);
  }
  .btn:active { transform: translateY(2px); }

  .pdf-block {
    background: var(--dialog-bg);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 24px;
    box-shadow:
      inset 0 0 0 2px var(--dialog-border-outer),
      inset 0 0 0 5px var(--dialog-bg),
      inset 0 0 0 7px var(--dialog-border-inner),
      0 5px 0 var(--dialog-shadow),
      0 8px 24px rgba(13, 5, 24, 0.5);
  }
  .pdf-frame {
    width: 100%;
    height: 85vh;
    min-height: 700px;
    border: 2px solid var(--dialog-border-inner);
    border-radius: 6px;
    background: var(--bg-2);
  }

  .pdf-fallback {
    padding: 32px;
    text-align: center;
    color: var(--text);
    font-size: 14px;
    background: rgba(245, 235, 255, 0.5);
    border-radius: 6px;
  }

  footer {
    margin-top: 60px;
    padding: 24px;
    text-align: center;
    background: var(--dialog-bg);
    border-radius: 12px;
    box-shadow:
      inset 0 0 0 2px var(--dialog-border-outer),
      inset 0 0 0 4px var(--dialog-bg),
      inset 0 0 0 5px var(--dialog-border-inner),
      0 3px 0 var(--dialog-shadow);
  }
  .contact-links {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .contact-links a {
    color: var(--dialog-border-inner);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
  }
  .contact-links a:hover { color: var(--accent-magenta-dark); }
  .footer-text { font-size: 11px; color: var(--text-dim); }

  @media (max-width: 640px) {
    nav { padding: 12px 20px; }
    main { padding: 90px 20px 80px; }
    h1 { font-size: 20px; }
    .pdf-frame { height: 65vh; }
  }

  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
  }
  .nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: color 0.2s;
    cursor: pointer;
    position: relative;
    display: inline-flex;
    align-items: center;
    line-height: 1;
    white-space: nowrap;
  }
  .nav-links a:hover, .nav-links a.active {
    color: var(--accent-magenta-dark);
  }
  .nav-links a.active::before {
    content: '▸';
    color: var(--accent-magenta-dark);
    margin-right: 4px;
    font-size: 11px;
    animation: bobArrow 0.8s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes bobArrow {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(2px); }
  }
  @media (max-width: 640px) {
    .nav-links {
      gap: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a { font-size: 11px; }
    .nav-links a.active::before { font-size: 9px; }
  }


  /* Van Gogh swirling stars */
  .vangogh-scenery {
    position: fixed;
    top: 0; left: 0; right: 0;
    width: 100%;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .vangogh-scenery svg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: auto;
    min-height: 100vh;
  }
  @keyframes starOrbPulse {
    0%, 100% { opacity: 0.85; filter: brightness(1); }
    50% { opacity: 1; filter: brightness(1.25); }
  }
  .star-orb {
    animation: starOrbPulse 4s ease-in-out infinite;
  }


  /* Footer icon links */
  .footer-icons {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .footer-icon {
    position: relative;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    text-decoration: none;
    color: var(--dialog-border-inner);
    transition: all 0.15s;
    padding: 0;
    font-family: inherit;
  }
  .footer-icon svg {
    width: 22px;
    height: 22px;
    transition: transform 0.2s;
  }
  .footer-icon:hover {
    color: var(--accent-cedar-dark, var(--accent-magenta-dark, var(--accent-cyan-dark, var(--accent-coral-dark))));
    transform: translateY(-2px);
  }
  .footer-icon:hover svg {
    transform: scale(1.1);
  }
  .icon-label {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dialog-border-inner);
    color: var(--dialog-bg);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, bottom 0.2s;
  }
  .footer-icon:hover .icon-label {
    opacity: 1;
    bottom: -32px;
  }
  .footer-icon.copied .icon-label {
    opacity: 1;
    bottom: -32px;
    background: var(--accent-cedar, var(--accent-magenta, var(--accent-cyan, var(--accent-coral))));
    color: white;
  }


  /* Van Gogh star animations — independent layers */
  @keyframes ringShimmer {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes swirlRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes corePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.25); opacity: 0.85; }
  }

  .star-orb .star-rings {
    animation: ringShimmer 3s ease-in-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  .star-orb .star-swirls {
    animation: swirlRotate 18s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  .star-orb .star-core {
    animation: corePulse 2.5s ease-in-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }

  /* Staggered timing per-star for organic feel */
  .star-orb:nth-child(2n) .star-rings { animation-delay: 0.8s; }
  .star-orb:nth-child(3n) .star-rings { animation-delay: 1.6s; }
  .star-orb:nth-child(2n) .star-swirls { animation-direction: reverse; }
  .star-orb:nth-child(3n) .star-swirls { animation-duration: 25s; }
  .star-orb:nth-child(2n) .star-core { animation-delay: 0.5s; }
  .star-orb:nth-child(3n) .star-core { animation-delay: 1.2s; animation-duration: 3s; }

</style>
</head>

<script>
const starfield = document.getElementById('starfield');
const starColors = ['', '', '', '', 'gold', 'magenta', 'cyan'];
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star ' + starColors[Math.floor(Math.random() * starColors.length)];
  const size = Math.random() * 2.5 + 1;
  star.style.width = size + 'px';
  star.style.height = size + 'px';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.animationDelay = Math.random() * 3 + 's';
  star.style.animationDuration = (Math.random() * 3 + 2) + 's';
  starfield.appendChild(star);
}

// Footer email copy
document.querySelectorAll('[data-copy-email]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const email = btn.dataset.copyEmail;
    const label = btn.querySelector('.icon-label');
    try {
      await navigator.clipboard.writeText(email);
      const orig = label.textContent;
      label.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.classList.remove('copied');
        label.textContent = orig;
      }, 1800);
    } catch (e) {
      window.location.href = 'mailto:' + email;
    }
  });
});

</script>
